[project]
name = "nvim"
version = "0.1.0"
description = "Virtualenvironment used by the python runtime in neovim"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.12.0",
    "doq>=0.10.0",
    "flake8>=7.3.0",
    "greenlet>=3.3.0",
    "isort>=7.0.0",
    "msgpack>=1.1.2",
    "pydocstyle>=6.3.0",
    "pynvim>=0.6.0",
    "ruff>=0.14.10",
    "sexpdata>=1.0.2",
    "six>=1.17.0",
    "websocket-client>=1.9.0",
]
